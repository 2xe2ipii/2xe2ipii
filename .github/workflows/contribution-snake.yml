name: Generate contribution snake

on:
  push:
    branches: [main]
    paths:
      - README.md
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-graphic
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate light and dark contribution graphics
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 2xe2ipii
          outputs: |
            assets/contribution-snake.svg
            assets/contribution-snake-dark.svg?palette=github-dark

      - name: Commit refreshed graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution graphic"
          git push
